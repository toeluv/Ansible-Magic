---
- name: Deploy Portainer using Docker
  hosts: all
  become: yes
  vars:
    portainer_data_dir: "/opt/portainer/data"
    portainer_port: "9000"

  tasks:
    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create directory for Portainer data
      file:
        path: "{{ portainer_data_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy Portainer container
      docker_container:
        name: portainer
        image: portainer/portainer-ce:latest
        state: started
        restart_policy: always
        ports:
          - "{{ portainer_port }}:9000"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "{{ portainer_data_dir }}:/data"
